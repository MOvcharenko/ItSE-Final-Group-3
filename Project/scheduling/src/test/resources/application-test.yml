# Tests: fresh in-memory H2 in PostgreSQL mode for every Spring context (TP3 reset-to-known-state).
spring:
  datasource:
    url: jdbc:h2:mem:scheduling-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

scheduling:
  time-zone: America/New_York
