# The default for "mvnw spring-boot:run": no passwords and no account management, just the test-account picker
# (Maya Brooks, L. Bianchi, Jordan Ellis), with data kept in ./data across restarts (git-ignored; delete it to start over).
#   cd Project/scheduling && ./mvnw spring-boot:run      → http://localhost:8080/
# For cross-device / multi-developer testing, use the "shared" profile instead (see commands.md).

spring:
  datasource:
    # AUTO_SERVER lets the "accounts" profile (port 8081) open the same database while this app runs on 8080.
    url: jdbc:h2:file:./data/scheduling;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

scheduling:
  auth:
    mode: dev            # test-account picker in the browser, POST /dev/token behind it