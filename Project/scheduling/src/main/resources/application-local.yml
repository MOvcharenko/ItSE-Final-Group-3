# The default for "mvnw spring-boot:run": no passwords and no account management, just the test-account picker
# (Maya Brooks, L. Bianchi, Jordan Ellis), with data kept in ./data across restarts (git-ignored; delete it to start over).
#   cd Project/scheduling && ./mvnw spring-boot:run      → http://localhost:8080/
# To sign in with usernames and passwords instead, run Project/account-service and use the "accounts" profile.

spring:
  datasource:
    url: jdbc:h2:file:./data/scheduling;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  h2:
    console:
      enabled: true

scheduling:
  auth:
    mode: dev            # test-account picker in the browser, POST /dev/token behind it
