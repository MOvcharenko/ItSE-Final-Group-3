spring:
  application:
    name: scheduling
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50   # loads lazy collections in batches, not one query per section
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    execution:
      shutdown:
        await-termination: true          # a restart finishes sending notices already under way
        await-termination-period: 30s

scheduling:
  time-zone: ""          # blank = JVM default; set e.g. America/New_York in deployment

management:
  endpoints:
    web:
      exposure:
        include: health
