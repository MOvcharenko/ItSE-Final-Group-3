# Local OIDC demo against the mock Core Platform (Project/core-platform-mock).
#   terminal 1:  cd Project/core-platform-mock && ./mvnw spring-boot:run
#   terminal 2:  cd Project/scheduling    && ./mvnw spring-boot:run -Dspring-boot.run.profiles=mock
#   browser:     http://localhost:8080/  → "Sign in with Core Platform"

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000   # Spring Boot fetches /.well-known/openid-configuration from here
  datasource:
    url: jdbc:h2:mem:scheduling;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  h2:
    console:
      enabled: true

scheduling:
  auth:
    mode: oidc