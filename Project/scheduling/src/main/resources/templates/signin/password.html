<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{signin/fragments :: head('Change password')}"></head>
<body>
<nav th:replace="~{signin/fragments :: nav(${account}, 'password')}"></nav>
<main class="account-page">
  <div th:replace="~{signin/fragments :: messages}"></div>
  <section class="panel">
    <div class="panel-head"><h2>Change password</h2></div>
    <div class="panel-body">
      <form class="stack" th:action="@{/account/password}" method="post">
        <div class="field">
          <label for="current">Current password</label>
          <input id="current" name="current" type="password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label for="password" th:text="'New password (at least ' + ${minLength} + ' characters)'">New password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required th:attr="minlength=${minLength}">
        </div>
        <div class="field">
          <label for="confirmation">New password again</label>
          <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn primary" type="submit">Change password</button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
