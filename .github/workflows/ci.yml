name: CI

# Runs only when code changes: anything in the two apps except Markdown files (README, commands.md, plans),
# or this workflow itself. Reports, logs, journals and design documents elsewhere in the repo never start it.
on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "Project/scheduling/**"
      - "Project/account-service/**"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
  pull_request:
    branches: [main]
    paths:
      - "Project/scheduling/**"
      - "Project/account-service/**"
      - ".github/workflows/ci.yml"
      - "!**/*.md"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The scheduling module, and the account service that plays the Core Platform (a separate app)
        project: [Project/scheduling, Project/account-service]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml
      - name: Build and test (unit + integration)
        run: ./mvnw -B verify
